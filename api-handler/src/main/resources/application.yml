spring:
  application:
    name: travel_agency

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGODB_DATABASE:travel-agency}

server:
  port: 8080

  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.epam.edp.demo: INFO

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

aws:
  region: ${AWS_REGION:eu-west-1}

  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  ses:
    region: ${AWS_REGION:eu-west-1}
    from-email: ${SES_FROM_EMAIL}

  s3:
    bucket: ${AWS_S3_BUCKET:run23-team1-travel-agency-docs-dev}
    prefix: ${AWS_S3_PREFIX:bookings}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

rabbitmq:
  exchange: ${RABBITMQ_EXCHANGE:bookings}
  routing-key: ${RABBITMQ_ROUTING_KEY:booking.state.changed}

# Expose only the health endpoint; enable K8s liveness/readiness probe groups.
# RabbitMQ is excluded from readiness — booking publish is async and non-blocking.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbitmq:
      enabled: false
